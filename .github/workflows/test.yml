name: test

# PNG and PDF bytes differ across Pillow and Python versions.
# This workflow does not compare image bytes. It checks exit status,
# text outputs through the unit tests, and that the smoke-test files exist.

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.14", "3.15"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install qbar
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Test the checkout import
        env:
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest -v test_qbar.py

      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        env:
          QBAR_TEST_INSTALLED: "1"
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python ${{ github.workspace }}/test_qbar.py

      - name: Smoke test the installed qbar command
        run: |
          out="${RUNNER_TEMP}/qbar_smoke"
          mkdir -p "$out"
          qbar \
            --q 'demo/2448/ref2448_pruned.*.Q' \
            --fam demo/2448/ref2448_pruned.fam \
            --groups demo/2448/groups.tsv --id-col id --group-col group \
            --blocks C-Ad,CG1,CG2,CG3,CG4,CG5,CG6,W-Ad,WEE1,WEE2,WWE1,WWE2 \
            --within iid \
            --anchor-group WWE1 \
            --color WWE1=#4470b7 --color WEE1=#dc1f26 --color WEE2=#0b5475 \
            --color CG6=#981b1e --color CG4=#f7922c --color CG3=#835ca6 \
            --color CG5=#fbee61 --color WWE2=#f6a3b1 \
            --outdir "$out"
          test -s "$out/panel.png"
          test -s "$out/panel.pdf"
          test -s "$out/order.tsv"
          test -s "$out/blocks.tsv"
          test -s "$out/align.tsv"
          test -s "$out/args.txt"
          test -s "$out/perm_K2.tsv"
          test -s "$out/perm_K12.tsv"
