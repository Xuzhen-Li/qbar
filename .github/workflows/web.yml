name: web

# Build the static page and run the Playwright suite.
# This workflow does not publish the page.

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/tests/package-lock.json

      - name: Install qbar
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Build the web page
        run: python tools/build_web.py

      - name: Install the Playwright package
        working-directory: web/tests
        run: npm ci

      - name: Install Chromium
        working-directory: web/tests
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright suite
        working-directory: web/tests
        env:
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: npx playwright test
